[project]
name = "atlas"
version = "0.1.0"
description = "Atlas AI Platform — local deep-research foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "confluent-kafka>=2.15.0,<3",
    "fastapi>=0.116.0",
    "fastmcp>=2.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.5.4",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.21.0,<1",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.15.0",
    "redis>=8.0.1,<9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]

# confluent-kafka ships inline types but does not mark its re-exports (e.g.
# ``confluent_kafka.admin.NewTopic``) with explicit ``as`` aliases, which
# --strict's implicit-reexport check would otherwise reject.
[[tool.mypy.overrides]]
module = "confluent_kafka.*"
implicit_reexport = true
