# Local Alertmanager configuration (Slice 15A3).
#
# Routes every alert to the Atlas-owned internal webhook receiver
# (atlas.observability.alert_receiver, reusing the shared backend image --
# see docker-compose.yml). No external credentials; internal-only.
global:
  resolve_timeout: 5m

route:
  receiver: atlas-alert-receiver
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: atlas-alert-receiver
    webhook_configs:
      - url: "http://alert-receiver:9465/webhook"
        send_resolved: true
