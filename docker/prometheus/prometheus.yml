# Local Prometheus configuration (Milestone 15 Slice 15A3).
#
# Scrapes the four Atlas process roles by their fixed internal Compose DNS
# names/ports. The API serves /metrics on its own existing ASGI port
# (8000); worker/outbox-relay/consumer each expose a dedicated internal-only
# metrics HTTP server (metrics_port, default 9464 -- see
# src/atlas/config/settings.py). None of these targets is published to the
# host; Prometheus itself binds only 127.0.0.1 in docker-compose.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: atlas-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: atlas-worker
    static_configs:
      - targets: ["worker:9464"]

  - job_name: atlas-outbox-relay
    static_configs:
      - targets: ["outbox-relay:9464"]

  - job_name: atlas-consumer
    static_configs:
      - targets: ["consumer:9464"]
