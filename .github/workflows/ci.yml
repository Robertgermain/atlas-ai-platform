name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Pinned exact version (no floating tags), matching docker-compose.yml.
        image: redis:8.8.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@127.0.0.1:5432/atlas_test
      # Explicitly select Redis for CI (Settings still default to noop when
      # unset). PostgreSQL/API integration tests override the rate-limiter
      # dependency to NoopRateLimiter so the shared TestClient peer identity
      # does not exhaust the fixed-window budget across unrelated POSTs;
      # dedicated Redis integration tests construct Redis-backed ports
      # directly. See docs/TESTING.md.
      ATLAS_COORDINATION_PROVIDER: redis
      ATLAS_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest
