x-atlas-backend-image: &atlas-backend-image "atlas-backend:${GIT_SHA:-dev}"

# Shared hardening for every Atlas backend application/one-shot service
# (Milestone 14 Slice 14B). Never applied to the third-party infrastructure
# services below (postgres/redis/kafka), which are configured independently.
# The image's own Tini ENTRYPOINT (Milestone 14 Slice 14A) is never
# overridden here and Compose does not additionally set `init: true` --
# doing so would add a second, redundant init boundary with no proven need.
x-atlas-hardening: &atlas-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      # Localhost-only: do not publish Postgres on all interfaces. Also used
      # directly by host-run processes/tests (unaffected by the Atlas
      # backend services below, which reach Postgres through the internal
      # `postgres:5432` Compose DNS name/port instead).
      - "127.0.0.1:5433:5432"
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Pinned exact version (no floating tags). Ephemeral coordination only
    # (rate limiting, worker heartbeats): never authoritative storage, so no
    # volume is mounted and data loss on restart is expected/acceptable.
    # Host-run API/worker processes must explicitly opt in:
    #   ATLAS_COORDINATION_PROVIDER=redis
    #   ATLAS_REDIS_URL=redis://127.0.0.1:6380/0
    # (Settings still default to noop when those env vars are unset.) The
    # containerized `api`/`worker` services below instead reach Redis through
    # the internal `redis:6379` Compose DNS name/port.
    image: redis:8.8.1
    ports:
      # Localhost-only, offset from the default 6379 so this container never
      # conflicts with a developer's own local Redis instance.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Pinned exact version (no floating tags). Single-node KRaft mode:
    # combined broker+controller, no ZooKeeper. Host-run API/worker/relay/
    # consumer processes must explicitly opt in:
    #   ATLAS_KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9094
    # The PLAINTEXT listener (kafka:9092) is for other Compose containers --
    # kafka-topic-init below, plus (Milestone 14 Slice 14B) the containerized
    # `outbox-relay`/`consumer` application services, which reach Kafka
    # through the internal `kafka:9092` Compose DNS name/port, never through
    # the host-published EXTERNAL listener.
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Atlas topic administration always goes through the typed AdminClient
      # helper/executable (src/atlas/outbox/topic_admin.py, run below as the
      # `kafka-topic-init` one-shot job); the broker never auto-creates topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Static, non-secret development KRaft cluster ID (generated once via
      # `kafka-storage.sh random-uuid`). Fine to be public; it only scopes
      # this single-node local metadata log, not a credential.
      CLUSTER_ID: "gNvDlYfoQ-iLZBOSMUlr1w"
    ports:
      # Localhost-only host access for host-run API/worker/relay/consumer
      # processes and developer Kafka CLI tools.
      - "127.0.0.1:9094:9094"
    volumes:
      - atlas_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Atlas backend application services (Milestone 14 Slice 14B). All six
  # services below share the exact same image (`atlas-backend:${GIT_SHA:-dev}`,
  # built once here on `api`) and its Tini ENTRYPOINT; only `command:` (CMD)
  # differs per role. Internal dependency addresses (postgres:5432,
  # redis:6379, kafka:9092) are hardcoded literals, not `${...}` shell/`.env`
  # interpolation, so a developer's host-oriented `.env` (ports 5433, 6380,
  # 9094) can never override them. Build once, then bring up the stack:
  #
  #   GIT_SHA=$(git rev-parse HEAD) \
  #   BUILD_DATE=$(git show -s --format=%cI "$(git rev-parse HEAD)") \
  #   docker compose build api
  #   docker compose up -d
  # ---------------------------------------------------------------------------

  db-migrate:
    # No `build:` here -- `api` is the single service that declares the
    # build (see the comment block above); `docker compose build api`
    # populates the `atlas-backend:${GIT_SHA:-dev}` tag once, and every
    # other service, including this one, only ever references that tag.
    image: *atlas-backend-image
    <<: *atlas-hardening
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  kafka-topic-init:
    # Typed one-shot topic administration (Milestone 14 Slice 14B):
    # `python -m atlas.outbox.topic_admin` delegates to the existing
    # `ensure_topic_exists`/`verify_topic_partitioning` AdminClient helpers
    # (src/atlas/outbox/topic_admin.py) -- no separate shell script and no
    # duplicated topic-administration logic. Idempotent: exits 0 immediately
    # if the reserved topic already exists with exactly one partition.
    image: *atlas-backend-image
    <<: *atlas-hardening
    environment:
      ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "-m", "atlas.outbox.topic_admin"]
    restart: "no"

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: *atlas-backend-image
    <<: *atlas-hardening
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_COORDINATION_PROVIDER: redis
      ATLAS_REDIS_URL: redis://redis:6379/0
      # Explicitly mapped, individually named optional credentials only --
      # never `env_file: .env` (which would inject every key present in the
      # host's `.env` file wholesale, including any unrelated secret added
      # to it later). Each of these is empty unless the developer's shell/
      # Compose `.env` sets it, and default Settings (fake providers) never
      # read them.
      ATLAS_OPENAI_API_KEY: ${ATLAS_OPENAI_API_KEY:-}
      ATLAS_ANTHROPIC_API_KEY: ${ATLAS_ANTHROPIC_API_KEY:-}
      ATLAS_TAVILY_API_KEY: ${ATLAS_TAVILY_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      # Compose startup-sequencing only -- `api` explicitly sets
      # ATLAS_COORDINATION_PROVIDER=redis above, so it should not attempt
      # its first request against a Redis that has not finished starting.
      # This does not change Atlas's own runtime behavior: the rate
      # limiter/heartbeat recorder still fail open on any Redis error at
      # any later point, exactly as before this dependency was added.
      redis:
        condition: service_healthy
    # API-only liveness signal for `docker compose ps`; not used by any
    # `depends_on` condition above -- API readiness is never treated as
    # proof that worker/outbox-relay/consumer are healthy (see below). No
    # curl/wget exists in the minimal runtime image, so this uses the stdlib
    # `urllib` already available on PATH.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Derived from the API's own default command (Dockerfile CMD), which
    # explicitly bounds uvicorn's graceful-shutdown window at
    # `--timeout-graceful-shutdown 10` (10s), plus 5s headroom for Tini's
    # signal forwarding and container teardown. Kubernetes independently
    # rederives its own termination budgets in Milestone 18; this value
    # governs Compose only.
    stop_grace_period: 15s

  worker:
    image: *atlas-backend-image
    <<: *atlas-hardening
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_COORDINATION_PROVIDER: redis
      ATLAS_REDIS_URL: redis://redis:6379/0
      ATLAS_OPENAI_API_KEY: ${ATLAS_OPENAI_API_KEY:-}
      ATLAS_ANTHROPIC_API_KEY: ${ATLAS_ANTHROPIC_API_KEY:-}
      ATLAS_TAVILY_API_KEY: ${ATLAS_TAVILY_API_KEY:-}
      # Worker-only LangSmith settings (Slice 15B). Never mapped on `api`
      # or any other service: the API constructs the same Settings class
      # without receiving the key. Unset key keeps fake-provider workers
      # offline. Empty URL preserves the SDK hosted default.
      ATLAS_LANGSMITH_API_KEY: ${ATLAS_LANGSMITH_API_KEY:-}
      ATLAS_LANGSMITH_PROJECT: ${ATLAS_LANGSMITH_PROJECT:-atlas-local}
      ATLAS_LANGSMITH_API_URL: ${ATLAS_LANGSMITH_API_URL:-}
      ATLAS_LANGSMITH_TIMEOUT_MS: ${ATLAS_LANGSMITH_TIMEOUT_MS:-5000}
      # Worker-only semantic grader mode (Slice 15C1). Default skipped
      # preserves current zero-weight behavior. Live is never inferred
      # from provider selection.
      ATLAS_SEMANTIC_GRADER_MODE: ${ATLAS_SEMANTIC_GRADER_MODE:-skipped}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      # Compose startup-sequencing only, matching `api` above -- `worker`
      # also explicitly sets ATLAS_COORDINATION_PROVIDER=redis (its
      # heartbeat thread). Runtime behavior is unchanged: the heartbeat
      # recorder still fails open on any later Redis error.
      redis:
        condition: service_healthy
    command: ["python", "-m", "atlas.worker"]
    # Derived from the worker's own default shutdown behavior:
    # `worker_processing_timeout_seconds` defaults to 60s (the orchestration
    # `Future.result` bound `ResearchJobWorker.request_shutdown()` waits for
    # via `shutdown_grace_seconds`, which itself defaults to the processing
    # timeout), plus 15s headroom for signal forwarding/process teardown
    # before Compose escalates to SIGKILL. Kubernetes independently rederives
    # its own termination budgets in Milestone 18.
    stop_grace_period: 75s

  outbox-relay:
    image: *atlas-backend-image
    <<: *atlas-hardening
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-topic-init:
        condition: service_completed_successfully
    command: ["python", "-m", "atlas.outbox"]
    # Derived from the relay's own bounded shutdown-path work, not from
    # `outbox_publish_lease_seconds` (30s default): the lease is a
    # fencing/crash-recovery constraint on how long a claimed row may sit
    # unpublished before another relay instance may reclaim it -- it is
    # not an additive step _during_ a graceful shutdown, and shutdown does
    # not wait for it to expire. What Compose actually waits out here, in
    # `_cleanup()` (see `src/atlas/outbox/__main__.py`), is: up to
    # `kafka_delivery_timeout_seconds` (default 10s) for an in-flight
    # record's publish to finish or time out, then up to that same
    # `kafka_delivery_timeout_seconds` bound again for the producer's own
    # `close()`/flush during cleanup, plus headroom for the advisory-lock
    # release, signal-handler restoration, and process scheduling that
    # follow. Kubernetes independently rederives its own termination
    # budgets in Milestone 18.
    stop_grace_period: 30s

  consumer:
    image: *atlas-backend-image
    <<: *atlas-hardening
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka-topic-init:
        condition: service_completed_successfully
    command: ["python", "-m", "atlas.consumer"]
    # Derived directly from `consumer_max_poll_interval_seconds` (default
    # 300s): the consumer's own bounded per-record retry/backoff is proven
    # (Settings validation) to complete safely under that Kafka group-timeout
    # ceiling, so 300s is the worst-case bound the process itself can still
    # be legitimately mid-attempt at when a shutdown signal arrives.
    # Kubernetes independently rederives its own termination budgets in
    # Milestone 18.
    stop_grace_period: 300s

  alert-receiver:
    # Atlas-owned internal Alertmanager webhook receiver (Milestone 15
    # Slice 15A3, `atlas.observability.alert_receiver`). Reuses the shared
    # backend image -- no seventh third-party image. Internal-only: no
    # `ports:` published to the host; verified via
    # `docker compose exec alert-receiver python -c "..."` loopback
    # requests against its own `GET /received`, never a host-published
    # port. Never logs a request body/header/URL/label/annotation/
    # fingerprint -- see the module's own docstring.
    image: *atlas-backend-image
    <<: *atlas-hardening
    command: ["python", "-m", "atlas.observability.alert_receiver"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9465/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 10s

  # ---------------------------------------------------------------------------
  # Local observability stack (Milestone 15 Slice 15A3): Prometheus, Grafana,
  # Alertmanager, Tempo, and the OpenTelemetry Collector. Every image below
  # is pinned to an exact tag *and* its resolved multi-architecture manifest-
  # list digest (never a floating tag) -- see docs/TECHNICAL_DESIGN.md for
  # the verification method and upstream release evidence for each. None of
  # these five is required for Atlas's own business processing to function;
  # every application role's tracing/metrics export is fail-open regardless
  # of whether any of these services is healthy, reachable, or even started.
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - atlas_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      # Localhost-only: a developer inspects targets/rules/alerts locally.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.listen-address=0.0.0.0:9093"
      # Single local node: disable HA gossip clustering entirely (empty
      # value). Verified locally: with clustering enabled, Alertmanager
      # waits a fixed ~10s "gossip settle" period before dispatching its
      # first notification even in this single-node topology; disabling it
      # removes both that delay and the otherwise-unused cluster listener.
      - "--cluster.listen-address="
    ports:
      # Localhost-only: a developer inspects alert grouping/routing/silences
      # locally. The receiver it routes to (alert-receiver) stays internal.
      - "127.0.0.1:9093:9093"
    depends_on:
      alert-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - atlas_tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      # Localhost-only: used to run trace-continuity verification queries
      # against Tempo's own HTTP query API (e.g. GET /api/traces/{id}).
      - "127.0.0.1:3200:3200"
    # No Docker healthcheck: the pinned image's own root filesystem has no
    # `/bin/sh` or `wget` (verified directly: `docker run --entrypoint
    # /bin/sh ...` and `--entrypoint /bin/wget ...` both fail with "no such
    # file or directory") -- there is no in-container tool a `CMD-SHELL`
    # healthcheck could invoke, exactly like `otel-collector` below. Tempo's
    # own `/ready` HTTP endpoint (published at `127.0.0.1:3200`, see above)
    # is still reachable from the host for manual verification. Fail-open by
    # design: no Atlas application container depends on this service's
    # health, and its own dependents (`otel-collector`/`grafana`) key off
    # `service_started`, not `service_healthy`.

  otel-collector:
    image: otel/opentelemetry-collector:0.158.0@sha256:5b97e6e3550ec6e48a71dba6f6304d349a293af8df4ee1f51da67be94fce2ecd
    volumes:
      - ./docker/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      tempo:
        condition: service_started
    # No Docker healthcheck: the core distribution's official image is a
    # `FROM scratch` build with no shell, curl, or wget (verified against
    # the official Dockerfile in open-telemetry/opentelemetry-collector-
    # releases) -- there is no in-container tool a CMD-SHELL healthcheck
    # could invoke. The `health_check` extension's HTTP endpoint
    # (0.0.0.0:13133, see docker/otel-collector/otel-collector-config.yaml)
    # is still configured and reachable from other containers on this
    # Compose network for manual verification. Fail-open by design: no
    # Atlas application container depends on this service's health.

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      # Anonymous Viewer-only access; no login form, no default admin
      # account, no committed credential (Slice 15A3 hardening). See
      # docs/TECHNICAL_DESIGN.md for the verification proving anonymous
      # Viewer access works, administrative mutation endpoints are denied,
      # and there is no usable default admin/admin path.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/atlas-dashboards:/etc/grafana/provisioning/atlas-dashboards:ro
    ports:
      # Localhost-only (hardening requirement: bind only 127.0.0.1).
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas_pg_data:
  atlas_kafka_data:
  atlas_prometheus_data:
  atlas_tempo_data:
